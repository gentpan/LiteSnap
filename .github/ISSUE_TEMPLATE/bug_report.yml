name: 问题反馈 / Bug report
description: 报告截图、编辑、导出或安装问题 / Report a problem with LiteSnap
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: LiteSnap 版本 / Extension version
      placeholder: "例如 / e.g. 0.1.7"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Chrome 版本与操作系统 / Chrome version and operating system
      placeholder: "例如 / e.g. Chrome 140, macOS 15"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤 / Steps to reproduce
      description: 请说明使用的截图方式、操作顺序，以及可公开访问的示例网页（如有）。 / Include the capture mode, steps, and a public example URL if available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual result
      description: 可附截图或错误提示，请先遮挡个人信息。 / You may attach screenshots or errors; redact personal information first.
    validations:
      required: true
